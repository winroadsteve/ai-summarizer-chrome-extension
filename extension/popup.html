<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h3>AI Page Summarizer</h3>
    <button id="summarizeBtn" class="primary-btn">Summarize Page</button>
    
    <div id="loader" class="loader hidden">
      <div class="spinner"></div> 
      <span>Summarizing content...</span>
    </div>

    <div id="output" class="output-box"></div>

    <div class="footer">
      <button id="clearBtn" class="secondary-btn">Clear</button>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
